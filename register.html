<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<title>Create account - Pulse Chat</title>
</head>
<body class="auth-body">
<div class="auth-shell">
  <aside class="auth-aside">
    <div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg></span><span>Pulse Chat</span></div>
    <div class="aside-demo" aria-hidden="true">
      <div class="bubble received">Did the build pass?<span class="meta">10:41</span></div>
      <div class="bubble sent">Green across the board<span class="meta">10:42 <span class="tick read">✓✓</span></span></div>
      <div class="bubble sent">Shipping it now<span class="meta">10:42 <span class="tick delivered">✓✓</span></span></div>
    </div>
    <p class="aside-copy">Messages arrive the moment they are sent. No refresh, no waiting.</p>
  </aside>
  <main class="auth-main">
    <div class="auth-card">
      <h1>Create your account</h1>
      <p class="muted">It takes less than a minute.</p>
      <div id="alertBox" class="alert" hidden role="alert"></div>
      <form id="registerForm" novalidate>
        <label class="field">
          <span>Full name</span>
          <input id="name" type="text" autocomplete="name" autofocus>
          <small class="field-error" data-for="name"></small>
        </label>
        <label class="field">
          <span>Username</span>
          <input id="username" type="text" autocomplete="username" placeholder="letters, numbers, . or _">
          <small class="field-error" data-for="username"></small>
        </label>
        <label class="field">
          <span>Email</span>
          <input id="email" type="email" autocomplete="email">
          <small class="field-error" data-for="email"></small>
        </label>
        <div class="row-2">
          <label class="field">
            <span>Password</span>
            <input id="password" type="password" autocomplete="new-password" placeholder="At least 6 characters">
            <small class="field-error" data-for="password"></small>
          </label>
          <label class="field">
            <span>Confirm password</span>
            <input id="confirmPassword" type="password" autocomplete="new-password">
            <small class="field-error" data-for="confirmPassword"></small>
          </label>
        </div>
        <button id="submitBtn" class="btn btn-primary btn-block" type="submit">Create account</button>
      </form>
      <p class="switch">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </main>
</div>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/register.js"></script>
</body>
</html>
