<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<title>Log in - Pulse Chat</title>
</head>
<body class="auth-body">
<div class="auth-shell">
  <aside class="auth-aside">
    <div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg></span><span>Pulse Chat</span></div>
    <div class="aside-demo" aria-hidden="true">
      <div class="bubble received">Did the build pass?<span class="meta">10:41</span></div>
      <div class="bubble sent">Green across the board<span class="meta">10:42 <span class="tick read">✓✓</span></span></div>
      <div class="bubble sent">Shipping it now<span class="meta">10:42 <span class="tick delivered">✓✓</span></span></div>
    </div>
    <p class="aside-copy">Messages arrive the moment they are sent. No refresh, no waiting.</p>
  </aside>
  <main class="auth-main">
    <div class="auth-card">
      <h1>Log in</h1>
      <p class="muted">Welcome back. Pick up where you left off.</p>
      <div id="alertBox" class="alert" hidden role="alert"></div>
      <form id="loginForm" novalidate>
        <label class="field">
          <span>Username or email</span>
          <input id="usernameOrEmail" type="text" autocomplete="username" autofocus>
        </label>
        <label class="field">
          <span>Password</span>
          <input id="password" type="password" autocomplete="current-password">
        </label>
        <button id="submitBtn" class="btn btn-primary btn-block" type="submit">Log in</button>
      </form>
      <p class="switch">New here? <a href="register.html">Create an account</a></p>
    </div>
  </main>
</div>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/login.js"></script>
</body>
</html>
